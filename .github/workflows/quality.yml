name: Quality

"on":
  push:
  pull_request:

permissions:
  contents: read

jobs:
  cpu-checks:
    name: CPU checks (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install CPU-only test dependency
        run: python -m pip install --upgrade pytest

      - name: Check documentation
        run: python scripts/check_docs.py

      - name: Compile Python sources
        run: python -m compileall -q cuda_kernel_lab benchmarks tests scripts

      - name: Check profiling shell syntax
        run: bash -n profile.sh

      - name: Test backend registries
        run: python -m pytest -q tests/test_python_registry.py

  cuda-tests:
    name: CUDA tests (self-hosted)
    if: ${{ vars.ENABLE_CUDA_CI == 'true' }}
    runs-on: [self-hosted, linux, x64, cuda]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Build extensions
        run: python setup.py build_ext --inplace

      - name: Run complete test suite
        run: python -m pytest -q
